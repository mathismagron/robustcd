[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robustcd"
version = "0.1.0"
description = "Robustness benchmark for bi-temporal change detection under physically grounded product degradations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pillow>=9.0",
]

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools.packages.find]
include = ["robustcd*"]
